services:
  devsecops-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-devsecops-analyzer}:${IMAGE_TAG:-latest}
    container_name: devsecops-analyzer
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./devsecops.db:/app/devsecops.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
