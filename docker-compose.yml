services:
  dependencysec-analyzer:
    image: ${IMAGE_NAME:-dependencysec-analyzer}:${IMAGE_TAG:-latest}
    container_name: dependencysec-analyzer
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./devsecops.db:/app/devsecops.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
